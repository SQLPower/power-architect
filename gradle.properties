# Conservative settings for the Windows filesystem (avoid file-lock races).
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Single worker: the two-pass annotation processing in the two projects races
# when multiple workers compile concurrently, intermittently producing broken
# generated persister classes.
org.gradle.workers.max=1