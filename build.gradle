plugins {
    id 'java'
    id 'application'
}

// Ensure the sqlpower-library subproject is configured before this project so
// its registered tasks (aptJar, etc.) are available at configuration time.
evaluationDependsOn(':sqlpower-library')

group = 'ca.sqlpower'
// Keep in sync with ArchitectVersion (ca.sqlpower.architect.ArchitectVersion).
version = 'V2.0.11'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ca.sqlpower.architect.swingui.ArchitectFrame'
}

// Some jars are still vendored in more than one of the legacy lib directories
// (e.g. junit-4.12.jar in lib/ and sqlpower-library/lib/main/), which produces
// duplicate entries when the application distribution is assembled.
tasks.withType(Tar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(Zip).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ---------------------------------------------------------------------------
// Vendored dependency directories (mirror of the historical Ant build)
// ---------------------------------------------------------------------------
def appLibs = files(fileTree(dir: 'lib', include: '*.jar'))
def appBuildLibs = files(fileTree(dir: 'buildlib', include: '*.jar'))
def libraryVendored = files(fileTree(dir: 'sqlpower-library/lib/main', include: '*.jar'))

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
        compileClasspath = files(configurations.compileClasspath, appLibs, appBuildLibs, libraryVendored)
    }
    test {
        java {
            srcDirs = ['regress']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
        compileClasspath += sourceSets.main.output
        compileClasspath += appLibs
        compileClasspath += appBuildLibs
        compileClasspath += libraryVendored
        compileClasspath += files(fileTree(dir: 'jdbc_drivers', include: '*.jar'))
        compileClasspath += files('testbed/hsqldb.jar')
        runtimeClasspath += sourceSets.main.output
        runtimeClasspath += files(fileTree(dir: 'jdbc_drivers', include: '*.jar'))
        runtimeClasspath += files('testbed/hsqldb.jar')
    }
    examples {
        java {
            srcDirs = ['example_code']
        }
        compileClasspath = files(configurations.compileClasspath, sourceSets.main.output, appLibs, appBuildLibs, libraryVendored)
    }
}

dependencies {
    // sqlpower-library (vendored submodule): core jar includes generated classes.
    implementation project(':sqlpower-library')

    // App's own vendored runtime libs.
    implementation appLibs

    // Build-time only libs (ant, gsbase for RecursiveTestSuite, etc.).
    implementation appBuildLibs

    // sqlpower-library's vendored runtime libs (guava, log4j, spring, httpclient,
    // jsr305, ...). The library jar does not bundle them, so the app must declare
    // them explicitly - exactly like the historical Ant runtime.classpath did with
    // ${sqlpower.library.home}/lib/main/*.jar.
    runtimeOnly libraryVendored

    // Libraries formerly vendored as jars (lib/ and sqlpower-library/lib/main/),
    // now resolved from Maven. reload4j is the maintained drop-in for log4j 1.2.
    implementation 'ch.qos.reload4j:reload4j:1.2.25'
    implementation 'com.google.guava:guava:33.3.1-jre'
    implementation 'commons-codec:commons-codec:1.17.1'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'commons-logging:commons-logging:1.3.4'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpcore:4.4.16'
    implementation 'org.apache.httpcomponents:httpmime:4.5.14'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    // Modern flat look and feel with built-in light and dark themes.
    implementation 'com.formdev:flatlaf:3.5.4'

    // Test-only libs.
    testImplementation project(':sqlpower-library')
    testImplementation project(path: ':sqlpower-library', configuration: 'testClasses')
    testImplementation files(fileTree(dir: 'jdbc_drivers', include: '*.jar'))
    testImplementation files('testbed/hsqldb.jar')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// Two-pass annotation processing for the app's own @Persistable classes.
// Mirrors the historical Ant build: compile app, run SPAnnotationProcessor
// (-proc:only) over app sources, compile the generated sources.
// ---------------------------------------------------------------------------
def appGeneratedSrcDir = layout.buildDirectory.dir('generated-src')

def libraryAptJar = project(':sqlpower-library').tasks.named('aptJar')

// Classpath for the annotation-processing passes: resolved dependencies plus
// the vendored jar trees (both the app's and the library's). Relying on
// sourceSets.main.compileClasspath is unreliable here because the custom
// source sets do not always see the resolved configurations.
def appProcessorClasspath = configurations.compileClasspath + appLibs + appBuildLibs + libraryVendored

tasks.register('runAppAnnotationProcessor', JavaCompile) {
    dependsOn compileJava
    dependsOn libraryAptJar
    dependsOn project(':sqlpower-library').tasks.named('compileGeneratedJava')
    source = sourceSets.main.java
    classpath = files(
        sourceSets.main.output,
        project(':sqlpower-library').sourceSets.generated.output,
        appProcessorClasspath
    )
    destinationDirectory = layout.buildDirectory.dir('tmp/app-proc-only')
    options.debug = true
    options.annotationProcessorPath = files(
        libraryAptJar.flatMap { it.archiveFile },
        sourceSets.main.output,
        appProcessorClasspath,
        project(':sqlpower-library').sourceSets.main.output
    )
    options.compilerArgs.addAll([
        '-proc:only',
        '-processor', 'ca.sqlpower.object.annotation.SPAnnotationProcessor',
        '-s', appGeneratedSrcDir.get().asFile.absolutePath
    ])
    doFirst {
        appGeneratedSrcDir.get().asFile.mkdirs()
    }
}

def appGeneratedClassesDir = layout.buildDirectory.dir('classes/java/app-generated')

tasks.register('compileAppGenerated', JavaCompile) {
    dependsOn runAppAnnotationProcessor
    dependsOn project(':sqlpower-library').tasks.named('compileGeneratedJava')
    source = fileTree(dir: appGeneratedSrcDir, include: '**/*.java')
    classpath = files(
        sourceSets.main.output,
        appProcessorClasspath,
        project(':sqlpower-library').sourceSets.main.output,
        project(':sqlpower-library').sourceSets.generated.output
    )
    destinationDirectory = appGeneratedClassesDir
    options.debug = true
}

tasks.named('compileJava') {
    options.compilerArgs += ['-proc:none']
}

// Build/test-only jars that must not ship with the installer (used by both the
// jar manifest Class-Path and the installer staging).
def installerLibExcludes = ['gsbase-2.0.1.jar', 'junit-4.12.jar', 'junit.jar',
                            'hamcrest-core-1.3.jar', 'UmlGraph.jar', 'ant-junit.jar']
def installerLibJars = {
    configurations.runtimeClasspath.files
        .findAll { it.name.endsWith('.jar') && !installerLibExcludes.contains(it.name) }
}

tasks.named('jar') {
    dependsOn compileAppGenerated
    from appGeneratedClassesDir
    manifest {
        attributes 'Main-Class': 'ca.sqlpower.architect.swingui.ArchitectFrame'
    }
    doFirst {
        // The installed application finds its dependencies via the manifest
        // Class-Path, exactly like the historical Ant `build.manifest` target.
        def libEntries = installerLibJars().collect { 'lib/' + it.name }
        manifest.attributes(['Class-Path': (libEntries + ['jdbc/']).join(' ')])
    }
}

// Generated SPPersisterHelper classes must be on the test runtime classpath.
tasks.named('test') {
    dependsOn compileAppGenerated
    classpath += files(appGeneratedClassesDir)
}

// ---------------------------------------------------------------------------
// Mondrian OLAP code generation from Mondrian.xml (XSLT 1.0, no Xalan needed).
// ---------------------------------------------------------------------------
def runXslt = { String name, String xsl, String xml, String out ->
    tasks.register(name) {
        def xsltFile = file("src/main/java/ca/sqlpower/architect/olap/${xsl}")
        def xmlFile = file("src/main/java/ca/sqlpower/architect/olap/${xml}")
        def outFile = file(out)
        inputs.files(xsltFile, xmlFile)
        outputs.file(outFile)
        doLast {
            def factory = javax.xml.transform.TransformerFactory.newInstance()
            def transformer = factory.newTransformer(
                new javax.xml.transform.stream.StreamSource(xsltFile))
            transformer.transform(
                new javax.xml.transform.stream.StreamSource(xmlFile),
                new javax.xml.transform.stream.StreamResult(outFile))
        }
    }
}

runXslt('mondrianModel', 'xml-to-java-classes.xsl', 'Mondrian.xml',
        'src/main/java/ca/sqlpower/architect/olap/MondrianModel.java')
runXslt('mondrianParser', 'xml-to-parser.xsl', 'Mondrian.xml',
        'src/main/java/ca/sqlpower/architect/olap/MondrianXMLReader.java')
runXslt('mondrianFormatter', 'xml-to-formatter.xsl', 'Mondrian.xml',
        'src/main/java/ca/sqlpower/architect/olap/MondrianXMLWriter.java')
runXslt('mondrianNewValueMaker', 'xml-to-new-value-maker.xsl', 'Mondrian.xml',
        'regress/ca/sqlpower/architect/util/MondrianNewValueMaker.java')
runXslt('mondrianPersistenceTests', 'xml-to-persister-tests.xsl', 'Mondrian.xml',
        'regress/ca/sqlpower/architect/olap/MondrianModelTest.java')

// ---------------------------------------------------------------------------
// Tests
// ---------------------------------------------------------------------------
test {
    useJUnitPlatform()
    maxHeapSize = '1024m'
    systemProperty 'ca.sqlpower.architect.test.dir', "${buildDir}/classes/java/test"
    systemProperty 'ca.sqlpower.headless', 'true'
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    // Mirror the historical Ant `junit` target, which ran exactly these four
    // entry suites (see AGENTS.md). Relying on Gradle's default discovery would
    // also pick up JUnit3 support/base classes (e.g. ArchitectTestCase) that
    // declare no test methods, producing spurious "No tests found in ...".
    include '**/ArchitectBusinessTestSuite.class'
    include '**/ArchitectSwingTestSuite.class'
    include '**/ArchitectAutoTests.class'
    include '**/ProfileTests.class'
}

// Validate example code (historical `ant compile-examples`).
tasks.register('compileExamples', JavaCompile) {
    source = sourceSets.examples.java
    classpath = sourceSets.examples.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/examples')
    options.debug = true
}

// ---------------------------------------------------------------------------
// Targets ported from the removed Apache Ant build (build.xml): user guide,
// javadoc, static analysis, source archives, distributions.
// ---------------------------------------------------------------------------
apply from: 'packaging.gradle'

// ---------------------------------------------------------------------------
// Windows installer (legacy Ant `windows_exe_installer` target, ported to
// Gradle). Uses the vendored izpack compiler and launch4j from ext-tools-home.
//
// - izpack 4.3.1 uses java.util.jar.Pack200 (removed in Java 14+), so the
//   izpack step must run on a JDK <= 11. The `java` on PATH is JDK 11 on this
//   machine; override with -PizpackJavaHome=<JDK 11 home> if needed.
// - launch4j runs on JDK 21 but needs a few --add-exports/--add-opens flags.
// ---------------------------------------------------------------------------
def installerVersion = project.version.toString()
def stagingDir = layout.buildDirectory.dir('staging').get().asFile
def installerWorkDir = layout.buildDirectory.dir('installer-work').get().asFile
def launch4jJar = file('ext-tools-home/launch4j-3.12/launch4j-win/launch4j.jar')
def izpackCompilerJar = file('ext-tools-home/izpack/lib/standalone-compiler.jar')
// izpack 4.3.1 uses java.util.jar.Pack200 (removed in Java 14+). The Gradle
// daemon runs on the JDK 21 toolchain, so resolve an explicit JDK <= 11 for
// the izpack subprocess (override with -PizpackJavaHome=<JDK 11 home>).
def izpackJavaHome = project.findProperty('izpackJavaHome')
        ?: 'C:/Program Files/Microsoft/jdk-11.0.16.101-hotspot'
def izpackJava = new File(izpackJavaHome, 'bin/java').absolutePath
def jdk21Launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }

def launch4jArgs = { File config ->
    [
        '--add-exports', 'java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '-jar', launch4jJar.absolutePath, config.absolutePath
    ]
}

tasks.register('stageForWindowsInstaller') {
    dependsOn tasks.named('jar')
    doLast {
        // On Windows another process (e.g. the IDE language server) may briefly
        // hold a handle on a previously produced file; clean what we can and
        // fall back to overwriting.
        try {
            delete stagingDir
        } catch (Exception e) {
            logger.warn('Could not fully clean the installer staging dir: ' + e.message)
        }
        stagingDir.mkdirs()
        new File(stagingDir, 'lib').mkdirs()
        new File(stagingDir, 'jdbc').mkdirs()
        copy {
            from tasks.named('jar').flatMap { it.archiveFile }
            into stagingDir
            rename { 'architect.jar' }
        }
        installerLibJars().each { f ->
            copy { from f; into new File(stagingDir, 'lib') }
        }
        copy { from fileTree(dir: 'jdbc_drivers', include: '*.jar'); into new File(stagingDir, 'jdbc') }
        copy { from 'LICENSE'; into stagingDir }
        copy { from fileTree(dir: 'src/main/resources/icons', include: '*.ico'); into stagingDir }
    }
}

tasks.register('buildWindowsInstaller') {
    dependsOn stageForWindowsInstaller
    doLast {
        delete installerWorkDir
        installerWorkDir.mkdirs()

        // ---- 1. architect.exe: launch4j wrapper around architect.jar ----
        def appLauncherConfig = new File(installerWorkDir, 'architect-launch4j.xml')
        appLauncherConfig.text = """<launch4jConfig>
  <dontWrapJar>true</dontWrapJar>
  <headerType>gui</headerType>
  <jar>architect.jar</jar>
  <outfile>${new File(stagingDir, 'architect.exe').absolutePath}</outfile>
  <errTitle>Java Runtime Required</errTitle>
  <priority>normal</priority>
  <downloadUrl>http://java.com/download</downloadUrl>
  <supportUrl>http://www.sqlpower.ca/forum</supportUrl>
  <stayAlive>false</stayAlive>
  <icon>${file('src/main/resources/icons/architect.ico').absolutePath}</icon>
  <jre><minVersion>21.0.0</minVersion></jre>
</launch4jConfig>
"""
        exec { commandLine([jdk21Launcher.get().executablePath.asFile.absolutePath] + launch4jArgs(appLauncherConfig)) }

        // ---- 2. izpack installer jar ----
        copy { from file('installer/RegistrySpec.xml'); into installerWorkDir }
        copy { from file('src/main/resources/icons/architect.png'); into installerWorkDir }
        copy { from 'LICENSE'; into installerWorkDir }
        new File(installerWorkDir, 'ArchitectShortcut.xml').text = """<shortcuts>
  <programGroup defaultName="SQL Power Suite" location="applications"/>
  <shortcut name="SQL Power Architect" target="\$INSTALL_PATH/architect.exe"
    programGroup="yes" commandLine="" workingDirectory="\$INSTALL_PATH"
    description="SQL Power Architect Modeling Tool"
    iconFile="\$INSTALL_PATH/architect.ico" desktop="yes" startMenu="yes"/>
</shortcuts>
"""
        def installXml = new File(installerWorkDir, 'install.xml')
        installXml.text = """<installation version="1.0">
  <info>
    <appname>SQL Power Architect</appname>
    <appversion>${installerVersion}</appversion>
    <url>http://www.sqlpower.ca/</url>
    <javaversion>11</javaversion>
  </info>
  <guiprefs height="600" resizable="yes" width="800"/>
  <locale><langpack iso3="eng"/></locale>
  <resources>
    <res id="Installer.image" src="architect.png"/>
    <res src="ArchitectShortcut.xml" id="shortcutSpec.xml"/>
    <res id="LicencePanel.licence" src="LICENSE"/>
    <res src="RegistrySpec.xml" id="RegistrySpec.xml"/>
  </resources>
  <listeners>
    <listener installer="SummaryLoggerInstallerListener"/>
    <listener installer="RegistryInstallerListener" uninstaller="RegistryUninstallerListener">
      <os family="windows"/>
    </listener>
  </listeners>
  <panels>
    <panel classname="HelloPanel"/>
    <panel classname="LicencePanel"/>
    <panel classname="TargetPanel"/>
    <panel classname="InstallPanel"/>
    <panel classname="ShortcutPanel"/>
    <panel classname="SimpleFinishPanel"/>
  </panels>
  <packs>
    <pack name="Core" required="yes">
      <description>Architect Core Files</description>
      <fileset dir="../staging" targetdir="\$INSTALL_PATH">
        <include name="architect.jar"/>
        <include name="architect.exe"/>
        <include name="LICENSE"/>
        <include name="*.ico"/>
      </fileset>
      <fileset dir="../staging/lib" targetdir="\$INSTALL_PATH/lib">
        <include name="*.jar"/>
      </fileset>
      <fileset dir="../staging/jdbc" targetdir="\$INSTALL_PATH/jdbc">
        <include name="*.jar"/>
      </fileset>
    </pack>
  </packs>
  <native type="izpack" name="ShellLink.dll"/>
  <native type="izpack" name="ShellLink_x64.dll"/>
  <native type="3rdparty" name="COIOSHelper.dll" stage="both">
    <os family="windows"/>
  </native>
</installation>
"""
        def installerJar = new File(installerWorkDir, "SQL-Power-Architect-Setup-Windows-${installerVersion}.jar")
        def izpackOutput = new ByteArrayOutputStream()
        def izpackResult = exec {
            commandLine izpackJava, '-jar', izpackCompilerJar.absolutePath,
                    installXml.absolutePath, '-b', installerWorkDir.absolutePath, '-o', installerJar.absolutePath
            standardOutput = izpackOutput
            errorOutput = izpackOutput
            ignoreExitValue = true
        }
        println "izpack exit: " + izpackResult.exitValue
        println "izpack output:\n" + izpackOutput.toString()
        if (izpackResult.exitValue != 0) {
            throw new GradleException('izpack compiler failed')
        }

        // ---- 3. wrap the installer jar into an .exe ----
        def setupConfig = new File(installerWorkDir, 'setup-launch4j.xml')
        def installerExe = new File(stagingDir, "SQL-Power-Architect-Setup-Windows-${installerVersion}.exe")
        setupConfig.text = """<launch4jConfig>
  <dontWrapJar>false</dontWrapJar>
  <headerType>gui</headerType>
  <jar>${installerJar.absolutePath}</jar>
  <outfile>${installerExe.absolutePath}</outfile>
  <errTitle>Java Runtime Required</errTitle>
  <priority>normal</priority>
  <downloadUrl>http://java.com/download</downloadUrl>
  <supportUrl>http://www.sqlpower.ca/forum</supportUrl>
  <stayAlive>false</stayAlive>
  <icon>${file('src/main/resources/icons/architect.ico').absolutePath}</icon>
  <singleInstance>
    <mutexName>SQL Power Architect Installer</mutexName>
    <windowTitle>SQL Power Architect Installer</windowTitle>
  </singleInstance>
  <jre><minVersion>11.0.0</minVersion></jre>
</launch4jConfig>
"""
        exec { commandLine([jdk21Launcher.get().executablePath.asFile.absolutePath] + launch4jArgs(setupConfig)) }

        def distDir = file('dist')
        distDir.mkdirs()
        copy { from installerExe; into distDir }

        println "Windows installer created: ${installerExe.absolutePath}"
        println "Copy available at: ${new File(distDir, installerExe.name).absolutePath}"
    }
}