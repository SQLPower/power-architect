name: Package installers

on:
  workflow_dispatch:            # manual trigger
  push:
    tags: ['V*']                # run when a release tag (V1.0.0, V2.0.11, ...) is pushed

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            task: jpackageExe
            artifact: SQL-Power-Architect-Windows
          - name: macos
            os: macos-latest
            task: jpackageMacDmg
            artifact: SQL-Power-Architect-macOS
          - name: linux-deb
            os: ubuntu-latest
            task: jpackageLinuxDeb
            artifact: SQL-Power-Architect-Linux-deb
          - name: linux-rpm
            os: ubuntu-latest
            task: jpackageLinuxRpm
            artifact: SQL-Power-Architect-Linux-rpm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # sqlpower-library is a git submodule
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build package (${{ matrix.name }})
        shell: bash
        run: ./gradlew ${{ matrix.task }} --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error